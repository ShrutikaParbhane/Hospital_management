{% extends "base.html" %}

{% block title %}Sign In - CareGrid Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <!-- Card Container -->
    <div class="bg-white border border-slate-100 rounded-3xl p-8 shadow-xl shadow-slate-200/50 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Sign In to CareGrid</h1>
            <p class="text-slate-400 text-sm">Access your clinical dashboard and schedules</p>
        </div>

        <!-- Alert Notification Panel -->
        <div id="alert-box" class="hidden p-4 rounded-xl text-sm border flex items-start space-x-2 transition-all duration-300">
            <i class="fa-solid fa-circle-info mt-0.5"></i>
            <span id="alert-msg" class="font-medium"></span>
        </div>

        <form id="login-form" class="space-y-4" method="POST">
            <!-- Email -->
            <div class="space-y-1.5">
                <label for="email" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="name@hospital.com"
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-slate-700 bg-slate-50/50">
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-1.5">
                <label for="password" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-slate-700 bg-slate-50/50">
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submit-btn"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:shadow-lg hover:shadow-emerald-500/20 text-white font-semibold py-3 rounded-xl transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center space-x-2">
                <span id="btn-text">Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-50 text-sm text-slate-400">
            <span>New patient? </span>
            <a href="{{ url_for('auth.register_page') }}" class="text-emerald-600 hover:underline font-semibold">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const form = e.target;
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const alertBox = document.getElementById('alert-box');
    const alertMsg = document.getElementById('alert-msg');
    
    // Reset alert
    alertBox.className = 'hidden';
    
    // Set loading state
    submitBtn.disabled = true;
    btnText.innerText = 'Signing In...';
    
    const formData = new FormData(form);
    
    try {
        const response = await fetch("{{ url_for('auth.login') }}", {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        
        if (result.success) {
            alertBox.className = 'p-4 rounded-xl text-sm border flex items-start space-x-2 bg-emerald-50 text-emerald-800 border-emerald-100';
            alertMsg.innerText = result.message;
            setTimeout(() => {
                window.location.href = result.redirect;
            }, 1000);
        } else {
            alertBox.className = 'p-4 rounded-xl text-sm border flex items-start space-x-2 bg-rose-50 text-rose-800 border-rose-100';
            alertMsg.innerText = result.message || 'Authentication failed.';
            submitBtn.disabled = false;
            btnText.innerText = 'Sign In';
        }
    } catch (error) {
        alertBox.className = 'p-4 rounded-xl text-sm border flex items-start space-x-2 bg-rose-50 text-rose-800 border-rose-100';
        alertMsg.innerText = 'Connection error. Please try again.';
        submitBtn.disabled = false;
        btnText.innerText = 'Sign In';
    }
});
</script>
{% endblock %}
